<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BirdNET · wall</title>
<style>
  /* ─────────────────────────────────────────────────────────────────
     Wall projection — museum-label grid.
     720p projector. 12-column grid. Asymmetric editorial layout.
     Three voices: serif (names), mono (phonetic + system), sans-caps
     (labels). Vertical rhythm anchored to the column gutter.
     ───────────────────────────────────────────────────────────────── */

  :root {
    --bg: #000;
    --ink: #f4f1ea;
    --accent: #6ee3a9;
    --dim: #8a9d92;
    --rule: rgba(244, 241, 234, 0.10);
    --rule-accent: rgba(110, 227, 169, 0.18);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "P052", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

    /* Grid system */
    --cols: 12;
    --col-gap: 1.6vw;
    --pad-x: 4vw;
    --pad-y: 3.6vh;
    --baseline: 1.4vh;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    height: 100vh; width: 100vw;
    overflow: hidden;
    user-select: none;
    cursor: none;
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* Outer page: 3 horizontal bands (header / stage / diary). Bands
     are separated by hairline borders on the header and diary; the
     stage absorbs the remaining space. */
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: var(--pad-y) var(--pad-x);
    gap: 0;
  }

  .hdr {
    padding-bottom: 2.6vh;
    border-bottom: 1px solid var(--rule);
  }
  .diary {
    padding-top: 2.6vh;
    border-top: 1px solid var(--rule);
  }
  .stage {
    padding: 4vh 0;
  }

  /* Shared 12-col grid for each band that needs it. */
  .row {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    column-gap: var(--col-gap);
  }

  /* Reusable small-caps label */
  .label {
    font-family: var(--sans);
    font-size: clamp(0.7rem, 0.85vw, 0.95rem);
    text-transform: uppercase;
    letter-spacing: 0.38em;
    color: var(--accent);
    opacity: 0.78;
    font-weight: 500;
  }

  /* ───────────────────────────────────────────────────────────────
     HEADER BAND — land acknowledgment (left, cols 1–9) + system
     status (right, cols 10–12). Bottom-aligned baselines. */
  .hdr { align-items: end; }
  .hdr-land { grid-column: 1 / 10; }
  .hdr-status { grid-column: 10 / 13; text-align: right; }

  .hdr-land .label { display: block; margin-bottom: 0.9vh; }
  .land-names {
    font-style: italic;
    font-size: clamp(1rem, 1.45vw, 1.65rem);
    color: var(--ink);
    opacity: 0.86;
    line-height: 1.25;
    letter-spacing: 0.005em;
  }
  .land-names .sep {
    color: var(--accent);
    opacity: 0.35;
    font-style: normal;
    margin: 0 0.45em;
  }

  .system {
    font-family: var(--mono);
    font-size: clamp(0.7rem, 0.82vw, 0.92rem);
    color: var(--dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .system .conn-dot {
    display: inline-block;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim);
    margin-right: 9px;
    vertical-align: 0.06em;
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  .system.live {
    color: var(--accent);
  }
  .system.live .conn-dot {
    background: var(--accent);
    box-shadow: 0 0 10px 0 rgba(110, 227, 169, 0.45);
  }

  /* ───────────────────────────────────────────────────────────────
     STAGE BAND — the bird. Two-column layout inside the 12-col
     grid: left voice (Indigenous: language → word → phonetic →
     literal) spans cols 1–9. Right voice (Western: museum tag
     number, common name, scientific name) spans cols 10–13,
     right-aligned. Rows are: top-meta / word / bottom-meta. The
     word is the only element that spans the full 12 columns so
     long single-line endonyms have room to breathe. */
  .stage {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: auto auto auto;
    column-gap: var(--col-gap);
    row-gap: 2.4vh;
    align-content: center;
    height: 100%;
  }

  /* Top-meta row */
  .stage-lang {
    grid-column: 1 / 8;
    grid-row: 1;
    align-self: end;
  }
  .stage-tag {
    grid-column: 8 / 13;
    grid-row: 1;
    text-align: right;
    align-self: end;
    font-family: var(--mono);
    font-size: clamp(0.7rem, 0.82vw, 0.92rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .stage-tag .tag-num { color: var(--accent); opacity: 0.9; margin-right: 1.2em; }
  .stage-tag .tag-time { color: var(--dim); }

  /* Hero word — spans full grid */
  .word-wrap {
    grid-column: 1 / 13;
    grid-row: 2;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.6vh;
  }
  .word {
    --word-size: 10vw;
    font-size: var(--word-size);
    line-height: 1.0;
    font-weight: 400;
    letter-spacing: -0.018em;
    color: var(--ink);
    white-space: nowrap;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .phon {
    font-family: var(--mono);
    font-size: clamp(1rem, 1.45vw, 1.6rem);
    color: var(--accent);
    letter-spacing: 0.01em;
    opacity: 0;
    transition: opacity 1.2s ease 0.25s;
  }

  /* Bottom-meta row */
  .literal {
    grid-column: 1 / 8;
    grid-row: 3;
    align-self: start;
    font-style: italic;
    font-size: clamp(0.95rem, 1.2vw, 1.35rem);
    color: var(--ink);
    opacity: 0;
    max-width: 50ch;
    line-height: 1.4;
    transition: opacity 1.2s ease 0.55s;
  }
  .literal:empty { display: none; }

  .museum {
    grid-column: 8 / 13;
    grid-row: 3;
    align-self: start;
    text-align: right;
    border-top: 1px solid var(--rule-accent);
    padding-top: 1.6vh;
    opacity: 0;
    transition: opacity 1.4s ease 0.45s;
  }
  .common {
    font-family: var(--serif);
    font-size: clamp(1.2rem, 1.7vw, 1.9rem);
    color: var(--ink);
    line-height: 1.2;
    letter-spacing: 0.005em;
  }
  .sci {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(0.9rem, 1.15vw, 1.25rem);
    color: var(--ink);
    opacity: 0.55;
    margin-top: 0.4vh;
    letter-spacing: 0.005em;
  }

  /* Reveal cascade */
  .stage.show .stage-lang .label { opacity: 0.78; }
  .stage.show .word { opacity: 1; transform: translateY(0); }
  .stage.show .phon { opacity: 0.9; }
  .stage.show .literal { opacity: 0.62; }
  .stage.show .museum { opacity: 1; }

  /* Idle — only a quiet pulse in the hero slot */
  .idle-line {
    grid-column: 1 / 13;
    grid-row: 2;
    align-self: center;
    text-align: left;
    font-family: var(--sans);
    font-size: clamp(0.9rem, 1.05vw, 1.15rem);
    text-transform: uppercase;
    letter-spacing: 0.5em;
    color: var(--ink);
    opacity: 0;
    transition: opacity 2s ease;
  }
  .stage.idle .idle-line { opacity: 0.25; }
  .stage:not(.idle) .idle-line { display: none; }
  .stage.idle .stage-lang,
  .stage.idle .stage-tag,
  .stage.idle .word-wrap,
  .stage.idle .literal,
  .stage.idle .museum { visibility: hidden; }

  /* ───────────────────────────────────────────────────────────────
     DIARY BAND — today's species. Two columns: label gutter (cols
     1–2) and ledger (cols 3–13). Single italic line, scrolls via
     truncation rather than wrap. */
  .diary { align-items: baseline; }
  .diary-label { grid-column: 1 / 3; }
  .diary-body  { grid-column: 3 / 13; }

  .today {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(0.95rem, 1.2vw, 1.35rem);
    color: var(--ink);
    opacity: 0.55;
    line-height: 1.4;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .today:empty::before {
    content: "—";
    opacity: 0.3;
    font-style: normal;
  }
  .today .sep {
    color: var(--accent);
    opacity: 0.4;
    margin: 0 0.55em;
    font-style: normal;
  }
  .today .now {
    color: var(--accent);
    opacity: 1;
    font-style: normal;
  }
  .today .count {
    font-family: var(--mono);
    font-style: normal;
    font-size: 0.78em;
    color: var(--accent);
    opacity: 0.7;
    margin-left: 0.3em;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

  <!-- HEADER: land + status -->
  <header class="row hdr">
    <div class="hdr-land">
      <span class="label">on the land of</span>
      <div class="land-names" id="land-names"></div>
    </div>
    <div class="hdr-status">
      <span class="system" id="system">
        <span class="conn-dot"></span><span id="meta-text">offline</span>
      </span>
    </div>
  </header>

  <!-- STAGE: the bird -->
  <main class="stage idle" id="stage">
    <div class="stage-lang"><span class="label" id="lang-label"></span></div>
    <div class="stage-tag">
      <span class="tag-num" id="tag-num"></span><span class="tag-time" id="tag-time"></span>
    </div>
    <div class="word-wrap">
      <div class="word" id="word"></div>
      <div class="phon" id="phon"></div>
    </div>
    <div class="literal" id="literal"></div>
    <div class="museum">
      <div class="common" id="common"></div>
      <div class="sci" id="sci"></div>
    </div>
    <div class="idle-line" id="idle-line">listening</div>
  </main>

  <!-- DIARY: today's species -->
  <footer class="row diary">
    <div class="diary-label"><span class="label">today</span></div>
    <div class="diary-body"><div class="today" id="today"></div></div>
  </footer>

<script type="module">
  const params = new URLSearchParams(location.search);
  const DEFAULT_SERVER = "https://seans-macbook-pro-m3.tail65b106.ts.net:8443";
  const server = params.get("server") || localStorage.getItem("birdnet.server") || DEFAULT_SERVER;
  const wsUrl = server.replace(/^http/, "ws") + "/stream/events";

  const $stage = document.getElementById("stage");
  const $word = document.getElementById("word");
  const $phon = document.getElementById("phon");
  const $literal = document.getElementById("literal");
  const $sci = document.getElementById("sci");
  const $common = document.getElementById("common");
  const $langLabel = document.getElementById("lang-label");
  const $landNames = document.getElementById("land-names");
  const $system = document.getElementById("system");
  const $metaText = document.getElementById("meta-text");
  const $today = document.getElementById("today");
  const $tagNum = document.getElementById("tag-num");
  const $tagTime = document.getElementById("tag-time");

  // fitWord — canvas-measured binary search. Caps at 10vw upper so
  // short words don't stretch; floors at 3vw so very long endonyms
  // still survive a single line.
  const _measureCtx = document.createElement("canvas").getContext("2d");
  function fitWord(el) {
    const text = el.textContent || "";
    if (!text) return;
    const cs = getComputedStyle(el);
    const ff = cs.fontFamily;
    const fw = cs.fontWeight || 400;
    const fs = cs.fontStyle || "normal";
    const ls = parseFloat(cs.letterSpacing) || 0;
    const vw = window.innerWidth;
    // 100vw - 2 * pad-x (4vw) = 92vw usable in the stage row.
    const max = vw * 0.92;
    let lo = 3, hi = 10;
    for (let i = 0; i < 16 && hi - lo > 0.05; i++) {
      const mid = (lo + hi) / 2;
      const px = (vw * mid) / 100;
      _measureCtx.font = `${fs} ${fw} ${px}px ${ff}`;
      const w = _measureCtx.measureText(text).width + ls * text.length;
      if (w <= max) lo = mid; else hi = mid;
    }
    el.style.setProperty("--word-size", lo.toFixed(2) + "vw");
  }
  window.addEventListener("resize", () => fitWord($word));

  function renderLand(territory) {
    if (!territory || !territory.territories || !territory.territories.length) return;
    const names = territory.territories.map((t) => t.name);
    $landNames.innerHTML = names
      .map((n) => `<span>${n}</span>`)
      .join(`<span class="sep">·</span>`);
  }

  let detectionCount = 0;

  function fmtTime(d) {
    const h = String(d.getHours()).padStart(2, "0");
    const m = String(d.getMinutes()).padStart(2, "0");
    return `${h}:${m}`;
  }

  function show(event) {
    const ind = event.indigenous;
    const name = ind && ind.available && ind.names && ind.names[0];
    if (!name) return;

    const langMeta = (ind.languages || {})[name.language] || {};
    const langText = langMeta.endonym || langMeta.english_name || name.language || "";
    $langLabel.textContent = langText;

    detectionCount += 1;
    $tagNum.textContent = `№ ${String(detectionCount).padStart(2, "0")}`;
    $tagTime.textContent = fmtTime(new Date());

    $word.textContent = name.word || "";
    fitWord($word);
    $phon.textContent = name.phonetic ? `[ ${name.phonetic} ]` : "";
    $literal.textContent = name.literal ? `“${name.literal}”` : "";
    $common.textContent = event.common_name || "";
    $sci.textContent = event.scientific_name || "";

    if (event.territory) renderLand(event.territory);

    $stage.classList.remove("idle");
    $stage.classList.remove("show");
    void $stage.offsetWidth;
    $stage.classList.add("show");

    loadToday(event.scientific_name);
  }

  function setConn(state) {
    $system.classList.toggle("live", state === "live");
    $metaText.textContent = state;
  }

  async function loadLand() {
    try {
      const t = await (await fetch(`${server}/territory?lat=44.92&lon=-79.37`)).json();
      renderLand(t);
    } catch {}
  }
  loadLand();

  async function loadToday(currentSci) {
    try {
      const r = await fetch(`${server}/catalog?source=listener`);
      const c = await r.json();
      if (!c.species || !c.species.length) { $today.innerHTML = ""; return; }
      const parts = c.species.map((s) => {
        const word = s.indigenous_name;
        const isNow = currentSci && s.scientific_name === currentSci;
        const n = s.individual_count || 0;
        const tail = n > 1 ? `<span class="count">×${n}</span>` : "";
        const inner = `<span>${word}</span>${tail}`;
        return isNow ? `<span class="now">${inner}</span>` : inner;
      });
      $today.innerHTML = parts.join(`<span class="sep">·</span>`);
    } catch {}
  }
  loadToday();
  setInterval(() => loadToday(), 60_000);

  async function bootstrapHero() {
    try {
      const r = await fetch(`${server}/catalog?source=listener`);
      const c = await r.json();
      const latest = (c.species || [])[0];
      if (!latest || !latest.indigenous_name) return;
      const lang = latest.indigenous_language && latest.indigenous_endonym
        ? { english_name: latest.indigenous_language, endonym: latest.indigenous_endonym }
        : {};
      const langKey = lang.english_name ? lang.english_name.toLowerCase().split(/\s|\//)[0] : "lang";
      show({
        scientific_name: latest.scientific_name,
        common_name: latest.common_name,
        indigenous: {
          available: true,
          names: [{
            language: langKey,
            word: latest.indigenous_name,
            phonetic: latest.indigenous_phonetic,
            literal: null,
          }],
          languages: { [langKey]: lang },
        },
        territory: null,
      });
      loadToday(latest.scientific_name);
    } catch {}
  }
  bootstrapHero();

  let ws;
  let backoff = 1000;
  function connect() {
    setConn("connecting");
    try {
      ws = new WebSocket(wsUrl);
    } catch (e) {
      setConn("ws error");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 30_000);
      return;
    }
    ws.onopen = () => { setConn("live"); backoff = 1000; };
    ws.onmessage = (m) => {
      try {
        const event = JSON.parse(m.data);
        if (event.type === "detection") show(event);
      } catch (e) { console.warn("bad event", e); }
    };
    ws.onclose = () => {
      setConn("offline");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 30_000);
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  connect();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  }
</script>
</body>
</html>
