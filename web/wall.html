<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BirdNET · wall</title>
<style>
  /* ────────────────────────────────────────────────────────────────
     Type system
     ────────────────────────────────────────────────────────────────
     Three voices, used consistently:
       — Serif (Iowan Old Style): Indigenous, English, Latin names. The
         language of attention.
       — Mono (SF Mono): the phonetic guide. The act of pronouncing.
       — Sans caps (SF Pro): labels and metadata. Quiet structural type.
     Built for a 720p projector — nothing smaller than ~18px at 1280×720
     (≈1.4vw). Generous breath between sections. High contrast on black.
     ──────────────────────────────────────────────────────────────── */

  :root {
    --bg: #000;
    --ink: #f4f1ea;        /* warm bone */
    --accent: #6ee3a9;     /* mint green */
    --dim: #8a9d92;
    --rule: rgba(110, 227, 169, 0.10);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "P052", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", monospace;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    height: 100vh; width: 100vw;
    overflow: hidden;
    user-select: none;
    cursor: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  body {
    display: grid;
    /* land header / hero stage / today diary / system */
    grid-template-rows: auto 1fr auto auto;
  }

  /* Re-usable small caps label — appears above territory and language. */
  .label {
    font-family: var(--sans);
    font-size: clamp(0.85rem, 1.05vw, 1.15rem);
    text-transform: uppercase;
    letter-spacing: 0.42em;
    color: var(--accent);
    opacity: 0.85;
    font-weight: 400;
  }

  /* Hairline accent rule between sections. */
  hr.rule {
    border: 0;
    height: 1px;
    background: var(--rule);
    margin: 0;
    width: 100%;
  }

  /* ───────────────────────────────────────────────────────────────
     1. LAND HEADER — the dedication. Always visible. The room is on
     this land before any bird calls. Reads:
       ON THE LAND OF
       Mississauga · Anishinabewaki ᐊᓂᔑᓈᐯᐗᑭ
     The syllabics ride inside the territory name string (data from
     Native Land Digital) — that's the "additional spelling".          */

  .land {
    padding: 5.5vh 6vw 3.5vh;
    text-align: center;
  }
  .land .label { display: block; margin-bottom: 1.6vh; }
  .land-names {
    font-style: italic;
    font-size: clamp(1.3rem, 2vw, 2.2rem);
    color: var(--ink);
    opacity: 0.88;
    line-height: 1.4;
    letter-spacing: 0.005em;
    max-width: 88vw;
    margin: 0 auto;
  }
  .land-names .sep {
    color: var(--accent);
    opacity: 0.4;
    font-style: normal;
    margin: 0 0.55em;
  }

  /* ───────────────────────────────────────────────────────────────
     2. HERO STAGE — the bird. Vertical stack, centered. Three blocks
     separated by breath:
       a) Language-source label (ANISHINAABEMOWIN)
       b) Indigenous word + phonetic (the bond between sound and sign)
       c) English common + Latin scientific (the museum label)
     No information is repeated.                                       */

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vh 5vw;
    text-align: center;
    gap: 0;
  }

  /* a) Language source above the word — like a poem byline. */
  .lang {
    margin-bottom: 3vh;
    opacity: 0;
    transition: opacity 1.2s ease;
  }

  /* b) The word + phonetic — treated as one typographic unit. */
  .word {
    --word-size: 11vw;
    font-size: var(--word-size);
    line-height: 1.0;
    font-weight: 400;
    letter-spacing: -0.015em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.4s ease, transform 1.4s ease;
    white-space: nowrap;
    max-width: 92vw;
  }
  .phon {
    font-family: var(--mono);
    font-size: clamp(1.2rem, 1.9vw, 2.1rem);
    color: var(--accent);
    opacity: 0;
    margin-top: 2.4vh;
    letter-spacing: 0.01em;
    transition: opacity 1.2s ease 0.3s;
  }
  .literal {
    font-style: italic;
    font-size: clamp(1rem, 1.35vw, 1.5rem);
    color: var(--ink);
    opacity: 0;
    margin-top: 1.6vh;
    max-width: 55ch;
    line-height: 1.4;
    transition: opacity 1.4s ease 0.6s;
  }
  .literal:empty { display: none; }

  /* c) Museum label — English first (the room speaks English),
     Latin underneath in italic for the science. Single column, snug
     leading — reads as one paragraph not three lines. */
  .museum {
    margin-top: 7vh;
    opacity: 0;
    transition: opacity 1.6s ease 0.9s;
  }
  .common {
    font-family: var(--serif);
    font-size: clamp(1.4rem, 2.3vw, 2.5rem);
    /* Source data ("Black-capped Chickadee") is already correctly
       cased — don't transform or we'll uppercase hyphenated halves. */
    letter-spacing: 0.005em;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 0.4vh;
  }
  .sci {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1rem, 1.45vw, 1.55rem);
    color: var(--ink);
    opacity: 0.55;
    letter-spacing: 0.005em;
  }

  /* Reveal cascade — entry animation. Times stagger so the eye walks
     down the stack: label → word → phonetic → literal → museum. */
  .stage.show .lang { opacity: 1; }
  .stage.show .word { opacity: 1; transform: translateY(0); }
  .stage.show .phon { opacity: 0.85; }
  .stage.show .literal { opacity: 0.6; }
  .stage.show .museum { opacity: 1; }

  /* Idle state — only the listening pulse, nothing else. */
  .stage.idle .idle-line { opacity: 0.22; }
  .stage.idle .lang,
  .stage.idle .word,
  .stage.idle .phon,
  .stage.idle .museum { display: none; }
  .idle-line {
    font-family: var(--sans);
    font-size: clamp(0.95rem, 1.1vw, 1.15rem);
    text-transform: uppercase;
    letter-spacing: 0.5em;
    color: var(--ink);
    opacity: 0;
    transition: opacity 2s ease;
  }

  /* ───────────────────────────────────────────────────────────────
     3. TODAY DIARY — every species heard today on a single italic
     line. Currently-on-hero entry highlighted accent; the
     voiceprint-clustered count appears as ×N when ≥2.                 */

  .today-wrap {
    padding: 2vh 6vw 2vh;
    border-top: 1px solid var(--rule);
  }
  .today-label {
    display: block;
    text-align: center;
    margin-bottom: 1vh;
    font-size: clamp(0.7rem, 0.85vw, 0.95rem);
    opacity: 0.55;
  }
  .today {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1rem, 1.45vw, 1.55rem);
    color: var(--ink);
    opacity: 0.55;
    line-height: 1.5;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 88vw;
    margin: 0 auto;
  }
  .today:empty { display: none; }
  .today-wrap:has(.today:empty) { display: none; }
  .today .sep { color: var(--accent); opacity: 0.4; margin: 0 0.55em; font-style: normal; }
  .today .now { color: var(--accent); opacity: 1; font-style: normal; }
  .today .count {
    font-family: var(--mono);
    font-style: normal;
    font-size: 0.82em;
    color: var(--accent);
    opacity: 0.7;
    margin-left: 0.25em;
  }

  /* ───────────────────────────────────────────────────────────────
     4. SYSTEM FOOTER — one line, bottom right. Just the heartbeat.    */

  .footer {
    padding: 1.4vh 2.6vw;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .system {
    font-family: var(--mono);
    font-size: clamp(0.65rem, 0.78vw, 0.85rem);
    color: var(--dim);
    opacity: 0.5;
    white-space: nowrap;
    letter-spacing: 0.06em;
  }
  .system .conn-dot {
    display: inline-block;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim);
    margin-right: 8px;
    vertical-align: middle;
    transition: background 0.4s ease;
    box-shadow: 0 0 0 0 rgba(110, 227, 169, 0);
  }
  .system.live .conn-dot {
    background: var(--accent);
    box-shadow: 0 0 12px 1px rgba(110, 227, 169, 0.35);
  }
</style>
</head>
<body>

  <!-- 1. land header — always visible -->
  <header class="land">
    <span class="label">on the land of</span>
    <div class="land-names" id="land-names"></div>
  </header>

  <hr class="rule" />

  <!-- 2. hero stage — bird block -->
  <main class="stage idle" id="stage">
    <div class="lang"><span class="label" id="lang-label"></span></div>
    <div class="word" id="word"></div>
    <div class="phon" id="phon"></div>
    <div class="literal" id="literal"></div>
    <div class="museum">
      <div class="common" id="common"></div>
      <div class="sci" id="sci"></div>
    </div>
    <div class="idle-line" id="idle-line">listening</div>
  </main>

  <!-- 3. today's diary -->
  <div class="today-wrap">
    <span class="label today-label">today</span>
    <div class="today" id="today"></div>
  </div>

  <!-- 4. system footer -->
  <div class="footer">
    <div class="system"><span class="conn-dot"></span><span id="meta-text">offline</span></div>
  </div>

<script type="module">
  const params = new URLSearchParams(location.search);
  const DEFAULT_SERVER = "https://seans-macbook-pro-m3.tail65b106.ts.net:8443";
  const server = params.get("server") || localStorage.getItem("birdnet.server") || DEFAULT_SERVER;
  const wsUrl = server.replace(/^http/, "ws") + "/stream/events";

  const $stage = document.getElementById("stage");
  const $word = document.getElementById("word");
  const $phon = document.getElementById("phon");
  const $literal = document.getElementById("literal");
  const $sci = document.getElementById("sci");
  const $common = document.getElementById("common");
  const $langLabel = document.getElementById("lang-label");
  const $landNames = document.getElementById("land-names");
  const $system = document.querySelector(".system");
  const $metaText = document.getElementById("meta-text");
  const $today = document.getElementById("today");

  // ──────────────────────────────────────────────────────────────────
  // fitWord — measure with canvas against the live computed font so
  // the shrink decision is synchronous and accurate regardless of
  // animation/visibility state. Binary-searches vw-based font size
  // until the word fits 92vw on a single line.
  const _measureCtx = document.createElement("canvas").getContext("2d");
  function fitWord(el) {
    const text = el.textContent || "";
    if (!text) return;
    const cs = getComputedStyle(el);
    const ff = cs.fontFamily;
    const fw = cs.fontWeight || 400;
    const fs = cs.fontStyle || "normal";
    const ls = parseFloat(cs.letterSpacing) || 0;
    const vw = window.innerWidth;
    const max = vw * 0.92;
    let lo = 3, hi = 10;
    for (let i = 0; i < 16 && hi - lo > 0.05; i++) {
      const mid = (lo + hi) / 2;
      const px = (vw * mid) / 100;
      _measureCtx.font = `${fs} ${fw} ${px}px ${ff}`;
      const w = _measureCtx.measureText(text).width + ls * text.length;
      if (w <= max) lo = mid; else hi = mid;
    }
    el.style.setProperty("--word-size", lo.toFixed(2) + "vw");
  }
  window.addEventListener("resize", () => fitWord($word));

  // Render the land header from a territory payload (Native Land
  // Digital format). Idempotent — safe to call multiple times.
  function renderLand(territory) {
    if (!territory || !territory.territories || !territory.territories.length) return;
    const names = territory.territories.map((t) => t.name);
    $landNames.innerHTML = names
      .map((n) => `<span>${n}</span>`)
      .join(`<span class="sep">·</span>`);
  }

  // ──────────────────────────────────────────────────────────────────
  // show: render a bird detection in the stage block. No information
  // is duplicated — the language source appears once (above the hero
  // word), English common name once (in the museum block), Latin once
  // (italic underneath the English).
  function show(event) {
    const ind = event.indigenous;
    const name = ind && ind.available && ind.names && ind.names[0];
    if (!name) return;

    const langMeta = (ind.languages || {})[name.language] || {};
    // Prefer the endonym (the language's name for itself). Fall back to
    // English if we don't have it. No parenthetical second copy.
    const langText = langMeta.endonym || langMeta.english_name || name.language || "";
    $langLabel.textContent = langText;

    $word.textContent = name.word || "";
    fitWord($word);
    $phon.textContent = name.phonetic ? `[ ${name.phonetic} ]` : "";
    $literal.textContent = name.literal ? `“${name.literal}”` : "";
    $common.textContent = event.common_name || "";
    $sci.textContent = event.scientific_name || "";

    if (event.territory) renderLand(event.territory);

    $stage.classList.remove("idle");
    $stage.classList.remove("show");
    void $stage.offsetWidth;
    $stage.classList.add("show");

    loadToday(event.scientific_name);
  }

  function setConn(state) {
    $system.classList.toggle("live", state === "live");
    $metaText.textContent = state;
  }

  // Boot the land header from /territory so it's populated before any
  // bird detection lands.
  async function loadLand() {
    try {
      const t = await (await fetch(`${server}/territory?lat=44.92&lon=-79.37`)).json();
      renderLand(t);
    } catch {}
  }
  loadLand();

  async function loadToday(currentSci) {
    try {
      const r = await fetch(`${server}/catalog?source=listener`);
      const c = await r.json();
      if (!c.species || !c.species.length) { $today.innerHTML = ""; return; }
      const others = c.species.filter((s) => s.scientific_name !== currentSci);
      if (others.length === 0) { $today.innerHTML = ""; return; }
      const parts = c.species.map((s) => {
        const word = s.indigenous_name;
        const now = currentSci && s.scientific_name === currentSci ? "now" : "";
        const n = s.individual_count || 0;
        const tail = n > 1 ? `<span class="count">×${n}</span>` : "";
        const inner = `<span>${word}</span>${tail}`;
        return now ? `<span class="now">${inner}</span>` : inner;
      });
      $today.innerHTML = parts.join(`<span class="sep">·</span>`);
    } catch {}
  }
  loadToday();
  setInterval(() => loadToday(), 60_000);

  // Bootstrap the hero from /catalog on load so a refresh doesn't sit
  // idle until the next bird fires.
  async function bootstrapHero() {
    try {
      const r = await fetch(`${server}/catalog?source=listener`);
      const c = await r.json();
      const latest = (c.species || [])[0];
      if (!latest || !latest.indigenous_name) return;
      const lang = latest.indigenous_language && latest.indigenous_endonym
        ? { english_name: latest.indigenous_language, endonym: latest.indigenous_endonym }
        : {};
      const langKey = lang.english_name ? lang.english_name.toLowerCase().split(/\s|\//)[0] : "lang";
      show({
        scientific_name: latest.scientific_name,
        common_name: latest.common_name,
        indigenous: {
          available: true,
          names: [{
            language: langKey,
            word: latest.indigenous_name,
            phonetic: latest.indigenous_phonetic,
            literal: null,
          }],
          languages: { [langKey]: lang },
        },
        territory: null,
      });
      loadToday(latest.scientific_name);
    } catch {}
  }
  bootstrapHero();

  // ──────────────────────────────────────────────────────────────────
  // WebSocket — live detection feed with exponential backoff to 30s.
  let ws;
  let backoff = 1000;
  function connect() {
    setConn("connecting");
    try {
      ws = new WebSocket(wsUrl);
    } catch (e) {
      setConn("ws error");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 30_000);
      return;
    }
    ws.onopen = () => { setConn("live"); backoff = 1000; };
    ws.onmessage = (m) => {
      try {
        const event = JSON.parse(m.data);
        if (event.type === "detection") show(event);
      } catch (e) { console.warn("bad event", e); }
    };
    ws.onclose = () => {
      setConn("offline");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 30_000);
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  connect();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  }
</script>
</body>
</html>
