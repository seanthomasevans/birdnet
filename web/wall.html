<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BirdNET · wall</title>
<style>
  :root {
    --bg: #000;
    --ink: #f4f1ea;
    --accent: #6ee3a9;
    --dim: #8a9d92;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }
  body {
    display: grid;
    grid-template-rows: 1fr auto auto;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 4vw;
    position: relative;
    text-align: center;
  }
  .lang {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: clamp(0.7rem, 1.1vw, 1rem);
    text-transform: uppercase;
    letter-spacing: 0.35em;
    color: var(--accent);
    opacity: 0;
    margin-bottom: 2.5vh;
    transition: opacity 1.2s ease;
  }
  .lang .endonym {
    text-transform: none;
    letter-spacing: 0.02em;
    font-style: italic;
    opacity: 0.75;
  }
  .word {
    font-size: clamp(4rem, 14vw, 18rem);
    line-height: 0.95;
    font-weight: 400;
    letter-spacing: -0.015em;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.6s ease, transform 1.6s ease;
    word-break: break-word;
    max-width: 95vw;
  }
  .phon {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: clamp(1rem, 1.8vw, 1.8rem);
    color: var(--accent);
    opacity: 0;
    margin-top: 3vh;
    letter-spacing: 0;
    transition: opacity 1.4s ease 0.4s;
  }
  .literal {
    font-style: italic;
    font-size: clamp(0.9rem, 1.4vw, 1.4rem);
    color: var(--ink);
    opacity: 0;
    margin-top: 2.2vh;
    max-width: 60ch;
    line-height: 1.4;
    transition: opacity 1.6s ease 0.8s;
  }
  .terr {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: clamp(1.1rem, 2.2vw, 2.4rem);
    color: var(--ink);
    font-style: italic;
    line-height: 1.35;
    max-width: 85vw;
    opacity: 0;
    margin-top: 4vh;
    transition: opacity 1.6s ease 0.6s;
  }
  .terr .label {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: clamp(0.65rem, 0.85vw, 0.85rem);
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 0.35em;
    color: var(--accent);
    margin-bottom: 1.2vh;
    opacity: 0.85;
  }
  .sci {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-style: italic;
    font-size: clamp(1rem, 1.8vw, 1.8rem);
    color: var(--ink);
    opacity: 0;
    margin-top: 5vh;
    letter-spacing: 0.01em;
    transition: opacity 2s ease 1.0s;
  }
  .common {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: clamp(1rem, 1.4vw, 1.5rem);
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    opacity: 0;
    margin-top: 2vh;
    transition: opacity 2s ease 1.4s;
  }
  .stage.show .lang,
  .stage.show .word,
  .stage.show .phon,
  .stage.show .literal,
  .stage.show .terr,
  .stage.show .sci,
  .stage.show .common {
    opacity: 1;
  }
  .stage.show .word { transform: translateY(0); }
  .stage.show .lang { opacity: 0.95; }
  .stage.show .phon { opacity: 0.7; }
  .stage.show .literal { opacity: 0.6; }
  .stage.show .terr { display: none; }
  .stage.show .sci { opacity: 0.5; }
  .stage.show .common { opacity: 0.78; }

  .stage.idle .idle-line {
    opacity: 0.18;
  }
  .idle-line {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: clamp(0.8rem, 1vw, 1rem);
    text-transform: uppercase;
    letter-spacing: 0.4em;
    color: var(--ink);
    opacity: 0;
    transition: opacity 2s ease;
  }

  /* Today's catalog — the room's listening diary as a single italic line
     above the footer. Each species appears once, ordered by most recently
     heard first, rendered as Indigenous endonym when available else Latin. */
  .today {
    padding: 1.6vh 4vw 0.6vh;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-style: italic;
    font-size: clamp(0.85rem, 1.05vw, 1.15rem);
    color: var(--ink);
    opacity: 0.35;
    line-height: 1.5;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 92vw;
    margin: 0 auto;
    transition: opacity 1.2s ease;
  }
  .today:empty { display: none; }
  .today .sep {
    color: var(--accent);
    opacity: 0.5;
    margin: 0 0.6em;
    font-style: normal;
  }
  .today .latin { font-style: italic; }
  .today .now { color: var(--accent); opacity: 0.95; font-style: normal; }
  .today .count {
    font-family: ui-monospace, "SF Mono", monospace;
    font-style: normal;
    font-size: 0.85em;
    color: var(--accent);
    opacity: 0.65;
    margin-left: 0.25em;
  }

  .footer {
    padding: 3vh 4vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2vw;
    border-top: 1px solid rgba(110, 227, 169, 0.08);
  }
  .territory {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: clamp(0.8rem, 1vw, 1.05rem);
    color: var(--ink);
    opacity: 0.45;
    letter-spacing: 0.04em;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: 1;
    font-style: italic;
  }
  .meta {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: clamp(0.65rem, 0.8vw, 0.85rem);
    color: var(--dim);
    opacity: 0.5;
    white-space: nowrap;
  }
  .meta .conn-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 8px;
    vertical-align: middle;
    transition: background 0.4s ease;
  }
  .meta.live .conn-dot { background: var(--accent); }

  /* Subtle breath — a slow pulse on the word so the room feels alive
     even in the silence between detections. */
  .stage.show .word {
    animation: breathe 9s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.82; }
  }
</style>
</head>
<body>
  <div class="stage idle" id="stage">
    <div class="lang"><span id="lang-label">—</span> <span class="endonym" id="lang-endonym"></span></div>
    <div class="word" id="word">—</div>
    <div class="phon" id="phon"></div>
    <div class="literal" id="literal"></div>
    <div class="terr" id="terr"><span class="label">on the land of</span><span id="terr-names"></span></div>
    <div class="sci" id="sci"></div>
    <div class="common" id="common"></div>
    <div class="idle-line" id="idle-line">listening</div>
  </div>
  <div class="today" id="today"></div>
  <div class="footer">
    <div class="territory" id="territory-foot"></div>
    <div class="meta"><span class="conn-dot"></span><span id="meta-text">offline</span></div>
  </div>

<script type="module">
  const params = new URLSearchParams(location.search);
  const DEFAULT_SERVER = "https://seans-macbook-pro-m3.tail65b106.ts.net:8443";
  const server = params.get("server") || localStorage.getItem("birdnet.server") || DEFAULT_SERVER;
  const wsUrl = server.replace(/^http/, "ws") + "/stream/events";

  const $stage = document.getElementById("stage");
  const $word = document.getElementById("word");
  const $phon = document.getElementById("phon");
  const $literal = document.getElementById("literal");
  const $terr = document.getElementById("terr");
  const $terrNames = document.getElementById("terr-names");
  const $sci = document.getElementById("sci");
  const $common = document.getElementById("common");
  const $langLabel = document.getElementById("lang-label");
  const $langEndonym = document.getElementById("lang-endonym");
  const $territoryFoot = document.getElementById("territory-foot");
  const $meta = document.querySelector(".meta");
  const $metaText = document.getElementById("meta-text");
  const $idleLine = document.getElementById("idle-line");

  const $today = document.getElementById("today");

  function show(event) {
    const ind = event.indigenous;
    const terr = event.territory;
    const name = ind && ind.available && ind.names && ind.names[0];

    // If we don't have a cited Indigenous name, drop the event silently.
    // The wall is for the names — no name, no display. Keep whatever is on
    // screen (or the idle "listening" state) until a species we have a
    // name for is detected.
    if (!name) return;

    const langMeta = (ind.languages || {})[name.language] || {};
    $langLabel.textContent = langMeta.english_name || name.language || "";
    $langEndonym.textContent = langMeta.endonym ? `(${langMeta.endonym})` : "";
    $word.textContent = name.word || "";
    $phon.textContent = name.phonetic ? `[ ${name.phonetic} ]` : "";
    // Literal translation only — drop notes from the hero; they belong in
    // the catalog popup, not on a projection wall. Keeps the stack tight.
    $literal.textContent = name.literal ? `“${name.literal}”` : "";

    // Territory: forefront, inside the hero block. Renders as
    // "ON THE LAND OF / Mississauga · Anishinabewaki" in serif italic.
    if (terr && terr.available && terr.territories && terr.territories.length) {
      $terrNames.textContent = terr.territories.map((t) => t.name).join(" · ");
      $terr.style.display = "";
    } else {
      $terr.style.display = "none";
    }

    // Latin: secondary, italic serif.
    $sci.textContent = event.scientific_name || "";
    // English: legible but secondary. Drop the confidence percentage from
    // the hero — it's wall furniture, not information the room needs.
    $common.textContent = event.common_name || "";

    $stage.classList.remove("idle");
    // Re-trigger entry animation by toggling.
    $stage.classList.remove("show");
    void $stage.offsetWidth;
    $stage.classList.add("show");

    // The last bird stays up forever. The room's listening diary along
    // the bottom edge gives the wall continuity between detections —
    // never decay back to "listening" and lose the moment.
    loadToday(event.scientific_name);
  }

  function setConn(state) {
    $meta.classList.toggle("live", state === "live");
    $metaText.textContent = state;
  }

  // Persistent territory in the footer — the listener stands somewhere
  // whether or not a bird is calling. Fetch once on boot.
  async function loadFooterTerritory() {
    try {
      const r = await fetch(`${server}/healthz`);
      const h = await r.json();
      const lat = h.listener?.stats?.last_detection?.lat;
      const lon = h.listener?.stats?.last_detection?.lon;
      // Even without a detection, the listener has a configured lat/lon. Fall
      // back to a synthetic /territory call against the cottage coords.
      const tlat = lat ?? 44.92, tlon = lon ?? -79.37;
      const t = await (await fetch(`${server}/territory?lat=${tlat}&lon=${tlon}`)).json();
      if (t.territories && t.territories.length) {
        $territoryFoot.textContent = "on the land of " + t.territories.map((x) => x.name).join(" · ");
      }
    } catch {}
  }
  loadFooterTerritory();

  // Today's catalog — every species heard today, endonym preferred. Highlights
  // whichever species is currently on the hero (so the eye can trace the
  // line and find it in the diary). Refresh every 60s and after each event.
  async function loadToday(currentSci) {
    try {
      const r = await fetch(`${server}/catalog?source=listener`);
      const c = await r.json();
      if (!c.species || !c.species.length) {
        $today.innerHTML = "";
        return;
      }
      // If the only species in the catalog is the one currently on the
      // hero, hide the strip — the diary becomes redundant repetition.
      const others = c.species.filter((s) => s.scientific_name !== currentSci);
      if (others.length === 0) {
        $today.innerHTML = "";
        return;
      }
      const parts = c.species.map((s) => {
        const word = s.indigenous_name;
        const now = currentSci && s.scientific_name === currentSci ? "now" : "";
        // Individual count: when we have ≥2 voiceprint-clustered birds for
        // this species, append "×N". Drop the badge for solo birds (just
        // visual noise — implicit one bird per name).
        const n = s.individual_count || 0;
        const tail = n > 1 ? `<span class="count">×${n}</span>` : "";
        const inner = `<span>${word}</span>${tail}`;
        return now ? `<span class="now">${inner}</span>` : inner;
      });
      $today.innerHTML = parts.join(`<span class="sep">·</span>`);
    } catch {}
  }
  loadToday();
  setInterval(() => loadToday(), 60_000);

  let ws;
  let backoff = 1000;
  function connect() {
    setConn("connecting");
    try {
      ws = new WebSocket(wsUrl);
    } catch (e) {
      setConn("ws error");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 30_000);
      return;
    }
    ws.onopen = () => { setConn("live"); backoff = 1000; };
    ws.onmessage = (m) => {
      try {
        const event = JSON.parse(m.data);
        if (event.type === "detection") show(event);
      } catch {}
    };
    ws.onclose = () => {
      setConn("reconnecting");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 30_000);
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  connect();

  // Click anywhere to enter fullscreen — projector setups need this.
  document.addEventListener("click", () => {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  });
</script>
</body>
</html>
