<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BirdNET · wall</title>
<style>
  :root {
    --bg: #000;
    --ink: #f4f1ea;
    --accent: #6ee3a9;
    --dim: #8a9d92;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }
  body {
    display: grid;
    /* land header / bird stage / today's diary / system meta */
    grid-template-rows: auto 1fr auto auto;
  }

  /* ─────────────────────────────────────────────────────────────────
     Land header — always-present acknowledgment of place.
     "ON THE LAND OF" sits above the territory names in serif italic;
     the syllabics ride along inside the name string ("Anishinabewaki
     ᐊᓂᔑᓈᐯᐗᑭ") — that's the "additional spelling" we want to keep. */
  .land {
    padding: 4vh 4vw 0;
    text-align: center;
    border-bottom: 1px solid rgba(110, 227, 169, 0.06);
    padding-bottom: 3vh;
  }
  .land-label {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: clamp(0.7rem, 0.95vw, 1rem);
    text-transform: uppercase;
    letter-spacing: 0.4em;
    color: var(--accent);
    opacity: 0.85;
    margin-bottom: 1vh;
  }
  .land-names {
    font-style: italic;
    font-size: clamp(1.1rem, 1.8vw, 2rem);
    color: var(--ink);
    opacity: 0.9;
    line-height: 1.35;
    letter-spacing: 0.01em;
    max-width: 88vw;
    margin: 0 auto;
  }
  .land-names .sep {
    color: var(--accent);
    opacity: 0.5;
    font-style: normal;
    margin: 0 0.55em;
  }
  .land:empty, .land-names:empty + * { display: none; }

  /* ─────────────────────────────────────────────────────────────────
     Bird stage — the hero. Vertical rhythm uses consistent vh units
     so the stack reads top-to-bottom without competing leadings. */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4vh 4vw;
    position: relative;
    text-align: center;
    gap: 0;
  }
  .lang {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: clamp(0.7rem, 1vw, 1rem);
    text-transform: uppercase;
    letter-spacing: 0.32em;
    color: var(--accent);
    opacity: 0;
    margin-bottom: 2.5vh;
    transition: opacity 1.2s ease;
  }
  .lang .endonym {
    text-transform: none;
    letter-spacing: 0.02em;
    font-style: italic;
    opacity: 0.7;
    margin-left: 0.4em;
  }
  .word {
    /* fitWord() sets --word-size live via canvas measureText so any
       endonym lands on a single line regardless of length. */
    --word-size: 13vw;
    font-size: var(--word-size);
    line-height: 1.0;
    font-weight: 400;
    letter-spacing: -0.015em;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.4s ease, transform 1.4s ease;
    white-space: nowrap;
    max-width: 95vw;
  }
  .phon {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: clamp(0.95rem, 1.4vw, 1.55rem);
    color: var(--accent);
    opacity: 0;
    margin-top: 2.5vh;
    letter-spacing: 0;
    transition: opacity 1.2s ease 0.3s;
  }
  .literal {
    font-style: italic;
    font-size: clamp(0.85rem, 1.15vw, 1.25rem);
    color: var(--ink);
    opacity: 0;
    margin-top: 1.8vh;
    max-width: 60ch;
    line-height: 1.4;
    transition: opacity 1.4s ease 0.6s;
  }
  .meta-line {
    /* Latin + English on a single horizontal line — tightens the
       bottom of the hero stack so it doesn't look like a column of
       afterthoughts. Separator is an accent dot. */
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 1.2em;
    margin-top: 3.5vh;
    opacity: 0;
    transition: opacity 1.6s ease 0.9s;
  }
  .meta-line .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent); opacity: 0.55;
    align-self: center;
  }
  .sci {
    font-style: italic;
    font-size: clamp(0.9rem, 1.3vw, 1.4rem);
    color: var(--ink);
    opacity: 0.55;
    letter-spacing: 0.01em;
  }
  .common {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: clamp(0.85rem, 1.15vw, 1.3rem);
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    opacity: 0.78;
  }
  .stage.show .lang,
  .stage.show .word,
  .stage.show .phon,
  .stage.show .literal,
  .stage.show .meta-line {
    opacity: 1;
  }
  .stage.show .word { transform: translateY(0); }
  .stage.show .lang { opacity: 0.95; }
  .stage.show .phon { opacity: 0.7; }
  .stage.show .literal { opacity: 0.6; }
  .stage.show .meta-line { opacity: 1; }

  .stage.idle .idle-line { opacity: 0.18; }
  .idle-line {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: clamp(0.8rem, 1vw, 1rem);
    text-transform: uppercase;
    letter-spacing: 0.4em;
    color: var(--ink);
    opacity: 0;
    transition: opacity 2s ease;
  }

  /* ─────────────────────────────────────────────────────────────────
     Today — single italic line of every species heard today.
     Currently-on-hero entry is highlighted; voiceprint-clustered
     counts (≥2) tagged with ×N. */
  .today {
    padding: 1.4vh 4vw 0.4vh;
    font-style: italic;
    font-size: clamp(0.85rem, 1.05vw, 1.15rem);
    color: var(--ink);
    opacity: 0.45;
    line-height: 1.5;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 92vw;
    margin: 0 auto;
    transition: opacity 1.2s ease;
  }
  .today:empty { display: none; }
  .today .sep { color: var(--accent); opacity: 0.5; margin: 0 0.55em; font-style: normal; }
  .today .now { color: var(--accent); opacity: 0.95; font-style: normal; }
  .today .count {
    font-family: ui-monospace, "SF Mono", monospace;
    font-style: normal;
    font-size: 0.85em;
    color: var(--accent);
    opacity: 0.65;
    margin-left: 0.25em;
  }

  /* ─────────────────────────────────────────────────────────────────
     Footer — just system state. Territory moved up into the header. */
  .footer {
    padding: 1.6vh 4vw;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .system {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: clamp(0.6rem, 0.75vw, 0.8rem);
    color: var(--dim);
    opacity: 0.5;
    white-space: nowrap;
  }
  .system .conn-dot {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim);
    margin-right: 8px;
    vertical-align: middle;
    transition: background 0.4s ease;
  }
  .system.live .conn-dot { background: var(--accent); }

  /* Subtle breath on the hero word — the room feels alive between
     detections without strobing. */
  .stage.show .word {
    animation: breathe 9s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.84; }
  }
</style>
</head>
<body>
  <header class="land">
    <div class="land-label">on the land of</div>
    <div class="land-names" id="land-names"></div>
  </header>

  <main class="stage idle" id="stage">
    <div class="lang"><span id="lang-label">—</span><span class="endonym" id="lang-endonym"></span></div>
    <div class="word" id="word">—</div>
    <div class="phon" id="phon"></div>
    <div class="literal" id="literal"></div>
    <div class="meta-line" id="meta-line">
      <span class="sci" id="sci"></span>
      <span class="dot"></span>
      <span class="common" id="common"></span>
    </div>
    <div class="idle-line" id="idle-line">listening</div>
  </main>

  <div class="today" id="today"></div>

  <div class="footer">
    <div class="system"><span class="conn-dot"></span><span id="meta-text">offline</span></div>
  </div>

<script type="module">
  const params = new URLSearchParams(location.search);
  const DEFAULT_SERVER = "https://seans-macbook-pro-m3.tail65b106.ts.net:8443";
  const server = params.get("server") || localStorage.getItem("birdnet.server") || DEFAULT_SERVER;
  const wsUrl = server.replace(/^http/, "ws") + "/stream/events";

  const $stage = document.getElementById("stage");
  const $word = document.getElementById("word");
  const $phon = document.getElementById("phon");
  const $literal = document.getElementById("literal");
  const $sci = document.getElementById("sci");
  const $common = document.getElementById("common");
  const $langLabel = document.getElementById("lang-label");
  const $langEndonym = document.getElementById("lang-endonym");
  const $landNames = document.getElementById("land-names");
  const $system = document.querySelector(".system");
  const $metaText = document.getElementById("meta-text");
  const $today = document.getElementById("today");

  // ──────────────────────────────────────────────────────────────────
  // fitWord: shrink --word-size so the rendered word fits one line.
  // Uses canvas measureText (matches the live font face) rather than
  // DOM scrollWidth — synchronous, layout-independent, accurate even
  // when the element is hidden mid-transition.
  const _measureCtx = document.createElement("canvas").getContext("2d");
  function fitWord(el) {
    const text = el.textContent || "";
    if (!text) return;
    const cs = getComputedStyle(el);
    const ff = cs.fontFamily;
    const fw = cs.fontWeight || 400;
    const fs = cs.fontStyle || "normal";
    const ls = parseFloat(cs.letterSpacing) || 0;
    const vw = window.innerWidth;
    const max = vw * 0.92;
    let lo = 3, hi = 14;
    for (let i = 0; i < 14 && hi - lo > 0.1; i++) {
      const mid = (lo + hi) / 2;
      const px = (vw * mid) / 100;
      _measureCtx.font = `${fs} ${fw} ${px}px ${ff}`;
      const w = _measureCtx.measureText(text).width + ls * text.length;
      if (w <= max) lo = mid; else hi = mid;
    }
    el.style.setProperty("--word-size", lo.toFixed(2) + "vw");
  }
  window.addEventListener("resize", () => fitWord($word));

  // ──────────────────────────────────────────────────────────────────
  // Render the land header. Always visible — territory should not
  // depend on a detection event.
  function renderLand(territory) {
    if (!territory || !territory.territories || !territory.territories.length) return;
    const names = territory.territories.map((t) => t.name);
    $landNames.innerHTML = names
      .map((n) => `<span>${n}</span>`)
      .join(`<span class="sep">·</span>`);
  }

  // ──────────────────────────────────────────────────────────────────
  // show: render a bird-detection event in the stage block.
  function show(event) {
    const ind = event.indigenous;
    const name = ind && ind.available && ind.names && ind.names[0];
    if (!name) return;

    const langMeta = (ind.languages || {})[name.language] || {};
    $langLabel.textContent = langMeta.english_name || name.language || "";
    $langEndonym.textContent = langMeta.endonym ? `(${langMeta.endonym})` : "";
    $word.textContent = name.word || "";
    fitWord($word);
    $phon.textContent = name.phonetic ? `[ ${name.phonetic} ]` : "";
    $literal.textContent = name.literal ? `“${name.literal}”` : "";
    $sci.textContent = event.scientific_name || "";
    $common.textContent = event.common_name || "";

    // Territory: if the event carries one, refresh the header.
    if (event.territory) renderLand(event.territory);

    $stage.classList.remove("idle");
    $stage.classList.remove("show");
    void $stage.offsetWidth;
    $stage.classList.add("show");

    loadToday(event.scientific_name);
  }

  function setConn(state) {
    $system.classList.toggle("live", state === "live");
    $metaText.textContent = state;
  }

  // Fetch territory once on boot so the header populates before any
  // bird detection lands.
  async function loadLand() {
    try {
      const t = await (await fetch(`${server}/territory?lat=44.92&lon=-79.37`)).json();
      renderLand(t);
    } catch {}
  }
  loadLand();

  async function loadToday(currentSci) {
    try {
      const r = await fetch(`${server}/catalog?source=listener`);
      const c = await r.json();
      if (!c.species || !c.species.length) { $today.innerHTML = ""; return; }
      const others = c.species.filter((s) => s.scientific_name !== currentSci);
      if (others.length === 0) { $today.innerHTML = ""; return; }
      const parts = c.species.map((s) => {
        const word = s.indigenous_name;
        const now = currentSci && s.scientific_name === currentSci ? "now" : "";
        const n = s.individual_count || 0;
        const tail = n > 1 ? `<span class="count">×${n}</span>` : "";
        const inner = `<span>${word}</span>${tail}`;
        return now ? `<span class="now">${inner}</span>` : inner;
      });
      $today.innerHTML = parts.join(`<span class="sep">·</span>`);
    } catch {}
  }
  loadToday();
  setInterval(() => loadToday(), 60_000);

  // Bootstrap the hero from /catalog on load so a page refresh doesn't
  // leave the wall idle until the next bird fires.
  async function bootstrapHero() {
    try {
      const r = await fetch(`${server}/catalog?source=listener`);
      const c = await r.json();
      const latest = (c.species || [])[0];
      if (!latest || !latest.indigenous_name) return;
      const lang = latest.indigenous_language && latest.indigenous_endonym
        ? { english_name: latest.indigenous_language, endonym: latest.indigenous_endonym }
        : {};
      const langKey = lang.english_name ? lang.english_name.toLowerCase().split(/\s|\//)[0] : "lang";
      show({
        scientific_name: latest.scientific_name,
        common_name: latest.common_name,
        indigenous: {
          available: true,
          names: [{
            language: langKey,
            word: latest.indigenous_name,
            phonetic: latest.indigenous_phonetic,
            literal: null,
          }],
          languages: { [langKey]: lang },
        },
        territory: null,
      });
      loadToday(latest.scientific_name);
    } catch {}
  }
  bootstrapHero();

  // ──────────────────────────────────────────────────────────────────
  // WebSocket — live detection feed. Auto-reconnects with exponential
  // backoff capped at 30s.
  let ws;
  let backoff = 1000;
  function connect() {
    setConn("connecting");
    try {
      ws = new WebSocket(wsUrl);
    } catch (e) {
      setConn("ws error");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 30_000);
      return;
    }
    ws.onopen = () => {
      setConn("live");
      backoff = 1000;
    };
    ws.onmessage = (m) => {
      try {
        const event = JSON.parse(m.data);
        if (event.type === "detection") show(event);
      } catch (e) { console.warn("bad event", e); }
    };
    ws.onclose = () => {
      setConn("offline");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 30_000);
    };
    ws.onerror = () => {
      try { ws.close(); } catch {}
    };
  }
  connect();

  // Register the service worker — caches the shell so the wall reopens
  // offline. Always claim the latest registration so the GH Pages
  // version flips to the newest deploy on next load.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  }
</script>
</body>
</html>
